<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>낚시 희귀 물고기 기대값 계산기</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --card: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #60a5fa;
      --good: #34d399;
      --warn: #fbbf24;
      --bad: #f87171;
      --line: #374151;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #0f172a, #020617);
      color: var(--text);
    }
    header {
      padding: 28px 20px 16px;
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: var(--muted); line-height: 1.5; }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 40px;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }
    section {
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,.25);
    }
    h2 { font-size: 18px; margin: 0 0 14px; }
    h3 { font-size: 15px; margin: 18px 0 10px; color: #bfdbfe; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 5px;
    }
    input, select {
      width: 100%;
      border: 1px solid var(--line);
      background: #020617;
      color: var(--text);
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 14px;
    }
    input[type="checkbox"] { width: auto; }
    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
      color: var(--text);
      font-size: 14px;
    }
    .button-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    button {
      border: 0;
      background: var(--accent);
      color: #07111f;
      font-weight: 700;
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
    }
    button.secondary { background: #334155; color: var(--text); }
    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    @media (max-width: 900px) {
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .metric {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
    }
    .metric .name { color: var(--muted); font-size: 12px; }
    .metric .value { font-size: 24px; font-weight: 800; margin-top: 4px; }
    .metric .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 12px;
      font-size: 13px;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      text-align: right;
      white-space: nowrap;
    }
    th:first-child, td:first-child { text-align: left; }
    th { color: #bfdbfe; background: #0b1220; position: sticky; top: 0; }
    tr.best { background: rgba(52, 211, 153, .12); }
    .note {
      color: var(--muted);
      font-size: 13px;
      margin-top: 12px;
    }
    .pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(96,165,250,.16);
      color: #bfdbfe;
      font-size: 12px;
    }
    .danger { color: var(--bad); }
    .good { color: var(--good); }
    .scroll { overflow-x: auto; max-height: 560px; }
  </style>
</head>
<body>
  <header>
    <h1>낚시 희귀 물고기 기대값 계산기</h1>
    <p>기본·도감·버프·갑옷 스탯과 펫 2마리 조합, 스킬/아이템을 넣고 희귀 물고기 기대 획득량을 비교합니다.</p>
  </header>

  <main>
    <section>
      <h2>입력값</h2>

      <h3>기본 가중치</h3>
      <div class="grid2">
        <div><label>일반</label><input id="normalW" type="number" step="0.1" value="110"></div>
        <div><label>희귀 기본값</label><input id="rareBase" type="number" step="0.1" value="25"></div>
        <div><label>고급 기본값</label><input id="highBase" type="number" step="0.1" value="45"></div>
        <div><label>기본 틱</label><input id="baseTick" type="number" step="0.1" value="90"></div>
      </div>

      <h3>스탯 입력</h3>
      <div class="grid2">
        <div><label>기본 행운</label><input id="statBaseLuck" type="number" step="0.1" value="30"></div>
        <div><label>기본 감각</label><input id="statBaseSense" type="number" step="0.1" value="30"></div>
        <div><label>도감 행운</label><input id="bookLuck" type="number" step="0.1" value="6.5"></div>
        <div><label>도감 감각</label><input id="bookSense" type="number" step="0.1" value="42"></div>
        <div><label>버프 행운</label><input id="buffLuck" type="number" step="0.1" value="41"></div>
        <div><label>버프 감각</label><input id="buffSense" type="number" step="0.1" value="43"></div>
        <div><label>갑옷 행운</label><input id="armorLuck" type="number" step="0.1" value="13.5"></div>
        <div><label>갑옷 감각</label><input id="armorSense" type="number" step="0.1" value="107.2"></div>
        <div><label>분배 탐색 간격</label><input id="stepSize" type="number" step="0.1" value="0.1"></div>
      </div>

      <h3>공식</h3>
      <div class="grid2">
        <div><label>희귀 행운 계수</label><input id="rareLuckCoef" type="number" step="0.01" value="1.2"></div>
        <div><label>희귀 감각 계수</label><input id="rareSenseCoef" type="number" step="0.01" value="1.8"></div>
        <div><label>고급 행운 계수</label><input id="highLuckCoef" type="number" step="0.01" value="0.05"></div>
        <div><label>고급 감각 계수</label><input id="highSenseCoef" type="number" step="0.01" value="0.05"></div>
        <div><label>감각 1당 틱 감소</label><input id="tickSenseCoef" type="number" step="0.01" value="0.3"></div>
        <div><label>최소 틱</label><input id="minTick" type="number" step="0.1" value="7"></div>
      </div>

      <h3>실패/더블/다중</h3>
      <div class="grid2">
        <div><label>실패 기본%</label><input id="failBase" type="number" step="0.1" value="20"></div>
        <div><label>행운 1당 실패 감소%</label><input id="failLuckCoef" type="number" step="0.01" value="0.15"></div>
        <div><label>더블 기본%</label><input id="doubleBase" type="number" step="0.1" value="11"></div>
        <div><label>행운 1당 더블 증가%</label><input id="doubleLuckCoef" type="number" step="0.01" value="0.45"></div>
        <div><label>어획량 증가율 기본</label><input id="catchRate" type="number" step="0.1" value="33.8"></div>
        <div><label>어획량 1당 더블 증가%</label><input id="doubleCatchCoef" type="number" step="0.01" value="0.7"></div>
        <div><label>다중 기본%</label><input id="multiBase" type="number" step="0.1" value="5"></div>
        <div><label>도감 다중%</label><input id="multiBook" type="number" step="0.1" value="3"></div>
        <div><label>미끼 다중%</label><input id="multiItem" type="number" step="0.1" value="8"></div>
      </div>

      <h3>스킬</h3>
      <label class="check"><input id="multiSkillOn" type="checkbox" checked> 다중확률 스킬 +55%</label>
      <label class="check"><input id="tickSkillOn" type="checkbox"> 틱 감소 스킬 -30</label>
      <div class="grid2">
        <div><label>다중 스킬%</label><input id="multiSkill" type="number" step="0.1" value="55"></div>
        <div><label>틱 감소 스킬</label><input id="tickSkill" type="number" step="0.1" value="30"></div>
      </div>

      
<h3>소모성 아이템</h3>
<label class="check"><input id="useBait" type="checkbox"> 떡밥 사용 (낚시속도 17% 감소)</label>
<label class="check"><input id="useLure" type="checkbox"> 미끼 사용 (다중 +8%, 낚시속도 10% 감소, 희귀 가중치 +50)</label>
<h3>펫 2마리 선택</h3>
      <p class="note">자동 탐색은 4개 펫 중 2개 조합을 모두 비교합니다.</p>
      <label class="check"><input id="optimizeArmor" type="checkbox"> 갑옷 스탯 총합 기준으로 행운/감각 자동 최적화</label>
      <label class="check"><input id="forcePets" type="checkbox"> 아래 펫 조합 강제 사용</label>
      <div class="grid2">
        <div>
          <label>펫 1</label>
          <select id="pet1">
            <option value="catch">어획량 +12%</option>
            <option value="multi">다중확률 +12%</option>
            <option value="normal">일반 가중치 -30</option>
            <option value="tick">틱 감소 -17</option>
          </select>
        </div>
        <div>
          <label>펫 2</label>
          <select id="pet2">
            <option value="multi">다중확률 +12%</option>
            <option value="catch">어획량 +12%</option>
            <option value="normal">일반 가중치 -30</option>
            <option value="tick">틱 감소 -17</option>
          </select>
        </div>
      </div>

      <div class="button-row">
        <button onclick="calculate()">계산하기</button>
        <button class="secondary" onclick="resetDefaults()">기본값 복원</button>
      </div>
    </section>

    <section>
      <h2>결과</h2>
      <div class="summary" id="summary"></div>
      <div class="scroll">
        <table id="resultTable">
          <thead>
            <tr>
              <th>순위/펫</th>
              <th>갑옷행운</th>
              <th>갑옷감각</th>
              <th>틱</th>
              <th>희귀%</th>
              <th>성공%</th>
              <th>더블%</th>
              <th>다중%</th>
              <th>틱당 희귀 기대</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p class="note">
        계산식: 성공률 × 희귀확률 × (1 + 더블확률) × (1 + 다중확률) ÷ 틱.
        더블확률, 다중확률, 성공률은 0~100%로 상한/하한 처리합니다.
      </p>
    </section>
  </main>

<script>
const petNames = {
  catch: "어획량+12",
  multi: "다중+12",
  normal: "일반-30",
  tick: "틱-17"
};

const petPairs = [
  ["catch","multi"],
  ["catch","normal"],
  ["catch","tick"],
  ["multi","normal"],
  ["multi","tick"],
  ["normal","tick"]
];

function n(id) { return Number(document.getElementById(id).value) || 0; }
function checked(id) { return document.getElementById(id).checked; }
function clamp(x, lo, hi) { return Math.min(hi, Math.max(lo, x)); }
function pct(x) { return (x * 100).toFixed(2) + "%"; }
function num(x, d=3) { return Number.isFinite(x) ? x.toFixed(d) : "-"; }

function hasPet(pets, name) { return pets.includes(name); }

function evalBuild(luckInvest, pets) {
  const armorTotal = n("armorLuck") + n("armorSense");
  const senseInvest = checked("optimizeArmor") ? armorTotal - luckInvest : n("armorSense");
  luckInvest = checked("optimizeArmor") ? luckInvest : n("armorLuck");
  const baseLuckTotal = n("statBaseLuck") + n("bookLuck") + n("buffLuck");
  const baseSenseTotal = n("statBaseSense") + n("bookSense") + n("buffSense");
  const luck = baseLuckTotal + luckInvest;
  const sense = baseSenseTotal + senseInvest;

  const petCatch = hasPet(pets, "catch") ? 12 : 0;
  const petMulti = hasPet(pets, "multi") ? 12 : 0;
  const petNormalDown = hasPet(pets, "normal") ? 30 : 0;
  const petTickDown = hasPet(pets, "tick") ? 17 : 0;

  const normalW = Math.max(0, n("normalW") - petNormalDown);
  const rareW = n("rareBase") + n("rareLuckCoef") * luck + n("rareSenseCoef") * sense + (checked("useLure") ? 50 : 0);
  const highW = n("highBase") + n("highLuckCoef") * luck + n("highSenseCoef") * sense;
  const totalW = normalW + rareW + highW;
  const rareProb = totalW > 0 ? rareW / totalW : 0;

  const rawTick =
    n("baseTick")
    - n("tickSenseCoef") * sense
    - petTickDown
    - (checked("tickSkillOn") ? n("tickSkill") : 0);
  let tick = Math.max(n("minTick"), rawTick);
  let speedMult = 1;
  if (checked("useBait")) speedMult *= 0.83;
  if (checked("useLure")) speedMult *= 0.90;
  tick = Math.max(n("minTick"), tick * speedMult);

  const fail = clamp((n("failBase") - n("failLuckCoef") * luck) / 100, 0, 1);
  const success = 1 - fail;

  const catchRate = n("catchRate") + petCatch;
  const doubleP = clamp((n("doubleBase") + n("doubleLuckCoef") * luck + n("doubleCatchCoef") * catchRate) / 100, 0, 1);

  const multiP = clamp((n("multiBase") + n("multiBook") + n("multiItem") + petMulti + (checked("multiSkillOn") ? n("multiSkill") : 0)) / 100, 0, 1);

  const perTickRare = success * rareProb * (1 + doubleP) * (1 + multiP) / tick;

  return {
    pets,
    luckInvest,
    senseInvest,
    luck,
    sense,
    tick,
    rawTick,
    rareProb,
    success,
    doubleP,
    multiP,
    perTickRare
  };
}

function optimizeForPets(pets) {
  const extra = n("armorLuck") + n("armorSense");
  const step = Math.max(0.01, n("stepSize"));
  let best = null;
  for (let l = 0; l <= extra + 1e-9; l += step) {
    const luckInvest = Math.min(extra, Math.round(l * 10000) / 10000);
    const r = evalBuild(luckInvest, pets);
    if (!best || r.perTickRare > best.perTickRare) best = r;
  }
  return best;
}

function calculate() {
  let pairs = petPairs;
  if (checked("forcePets")) {
    const p1 = document.getElementById("pet1").value;
    const p2 = document.getElementById("pet2").value;
    pairs = p1 === p2 ? [[p1]] : [[p1, p2]];
  }

  const results = pairs.map(optimizeForPets).sort((a,b) => b.perTickRare - a.perTickRare);
  render(results);
}

function render(results) {
  const best = results[0];
  const summary = document.getElementById("summary");
  summary.innerHTML = `
    <div class="metric"><div class="name">추천 펫</div><div class="value" style="font-size:18px">${best.pets.map(p => petNames[p]).join(" + ")}</div><div class="sub">펫 2마리 기준</div></div>
    <div class="metric"><div class="name">추천 갑옷 스탯</div><div class="value" style="font-size:18px">행운 ${num(best.luckInvest,1)} / 감각 ${num(best.senseInvest,1)}</div><div class="sub">최종 행운 ${num(best.luck,1)}, 감각 ${num(best.sense,1)}</div></div>
    <div class="metric"><div class="name">틱</div><div class="value">${num(best.tick,2)}</div><div class="sub">계산틱 ${num(best.rawTick,2)}</div></div>
    <div class="metric"><div class="name">틱당 희귀 기대</div><div class="value">${num(best.perTickRare,4)}</div><div class="sub">값이 높을수록 좋음</div></div>
  `;

  const tbody = document.querySelector("#resultTable tbody");
  tbody.innerHTML = "";
  results.forEach((r, i) => {
    const tr = document.createElement("tr");
    if (i === 0) tr.className = "best";
    tr.innerHTML = `
      <td>${i+1}. ${r.pets.map(p => petNames[p]).join(" + ")}</td>
      <td>${num(r.luckInvest,1)}</td>
      <td>${num(r.senseInvest,1)}</td>
      <td>${num(r.tick,2)}</td>
      <td>${pct(r.rareProb)}</td>
      <td>${pct(r.success)}</td>
      <td>${pct(r.doubleP)}</td>
      <td>${pct(r.multiP)}</td>
      <td><b>${num(r.perTickRare,5)}</b></td>
    `;
    tbody.appendChild(tr);
  });
}

function resetDefaults() {
  const defaults = {
    normalW:110, rareBase:25, highBase:45, baseTick:90,
    statBaseLuck:30, statBaseSense:30, bookLuck:6.5, bookSense:42, buffLuck:41, buffSense:43, armorLuck:13.5, armorSense:107.2, stepSize:0.1,
    rareLuckCoef:1.2, rareSenseCoef:1.8, highLuckCoef:0.05, highSenseCoef:0.05,
    tickSenseCoef:0.3, minTick:7, failBase:20, failLuckCoef:0.15,
    doubleBase:11, doubleLuckCoef:0.45, catchRate:33.8, doubleCatchCoef:0.7,
    multiBase:8, multiItem:8, multiSkill:55, tickSkill:30
  };
  for (const [k,v] of Object.entries(defaults)) document.getElementById(k).value = v;
  document.getElementById("multiSkillOn").checked = true;
  document.getElementById("tickSkillOn").checked = false;
  document.getElementById("forcePets").checked = false;
  document.getElementById("optimizeArmor").checked = false;
  calculate();
}

calculate();
</script>
</body>
</html>
